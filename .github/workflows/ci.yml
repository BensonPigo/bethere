# Objective test results for every push and pull request
# (docs/process/development-process.md section 7).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are costly and often queued, so macOS runs only on
        # main; feature branches get Linux (production) and Windows.
        os: ${{ github.ref == 'refs/heads/main' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
